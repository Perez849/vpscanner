name: Estudio de evidencia

# Cada domingo recalcula la evidencia (S&P 500 + Nasdaq-100, 10 años): data/evidence.json y data/evidence_report.txt.
on:
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas lxml
      - name: Caché de precios
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prices-vp-${{ github.run_id }}
          restore-keys: prices-vp-
      - name: Estudio
        run: python -u -m vp study --out data
      - name: Guardar datos
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/evidence.json data/evidence_report.txt
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: evidencia $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
      - name: Guardar caché (también si falla)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: prices-vp-${{ github.run_id }}
