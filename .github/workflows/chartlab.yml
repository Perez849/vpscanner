name: Laboratorio de gráficos

# Regenera los gráficos anotados de charts.html (patrones, soportes/resistencias, entrada/stop/objetivo) con los
# datos de cierre de cada día. Solo escribe scanner/data/charts/*.json; no toca el modelo ni las alertas.
on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'valores separados por comas (vacío = lista por defecto de 52 valores)'
        default: ''

permissions:
  contents: write

concurrency:
  group: chartlab
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas
      - name: Tests del laboratorio
        run: python tests/test_engine.py
      - name: Generar gráficos
        env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          cd scanner
          python -u chartlab.py --symbols "$SYMBOLS"
      - name: Guardar datos
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scanner/data/charts
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: gráficos $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
