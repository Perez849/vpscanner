name: Scan diario

# Corre tras el cierre de Wall Street (16:00 ET = 20:00/21:00 UTC). GitHub usa UTC.
on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas
      - name: Tests del motor
        run: python tests/test_engine.py
      - name: Escanear
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scanner
          python -u scan.py
      - name: Guardar datos
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scanner/data/*.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: scan $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
