name: Cribador de la regla de impulso (diario)

# Parte 2 del laboratorio (separada del chartismo): tras el cierre de Wall Street calcula qué acciones del S&P 500 y el Nasdaq-100 cumplen hoy cada una de las tres entradas con nombre
# («bajo 200», «2+ bajistas», «RSI(2) ≤ 10»: impulso alto a 12 meses que ha caído), con el plan de la escalera (+4 % → +10 %), la fiabilidad del modelo y el plan de hoy, y lo guarda en data/impulso.json; data/impulso_hist.json acumula
# cada día las que cumplían y data/impulso_track.json simula con precios reales lo que pasó con cada una (track record hacia delante).
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impulso
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas lxml scikit-learn
      - name: Caché de precios
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prices-impulso-${{ github.run_id }}
          restore-keys: prices-impulso-
      - name: Pruebas del cribador
        run: python tests/test_vp.py screen
      - name: Cribar
        run: python -u -m vp screen --out data
      - name: Guardar datos
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/impulso.json data/impulso_hist.json data/impulso_track.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: cribador de impulso $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
      - name: Guardar caché (también si falla)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: prices-impulso-${{ github.run_id }}
