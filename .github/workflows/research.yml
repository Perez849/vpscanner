name: Investigación (validación fuera de muestra)

# Descarga 10 años del universo completo, evalúa todos los setups contra un benchmark de
# entrada aleatoria y vuelca el informe en la rama claude/research-results.
on:
  push:
    branches: ['claude/vpscanner-rebuild']
    paths:
      - 'scanner/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:
    inputs:
      cmd:
        description: 'explore | final'
        default: 'explore'
      refresh_universe:
        description: 'Refrescar listas S&P desde Wikipedia (true/false)'
        default: 'true'

permissions:
  contents: write

jobs:
  research:
    if: "!contains(github.event.head_commit.message, '[no-research]')"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas lxml scikit-learn
      - name: Caché de precios
        uses: actions/cache@v4
        with:
          path: scanner/cache
          key: prices-v2-${{ github.run_id }}
          restore-keys: prices-v2-
      - name: Universo
        run: |
          cd scanner
          python universe.py --refresh || python universe.py
      - name: Investigación
        env:
          INPUT_CMD: ${{ github.event.inputs.cmd }}
        run: |
          mkdir -p /tmp/out
          cd scanner
          CMD="${INPUT_CMD:-$(cat research_cmd.txt)}"
          python -u research.py $CMD --out /tmp/out 2>&1 | tee /tmp/out/research_log.txt
      - name: Publicar resultados en rama aparte
        if: always()
        run: |
          cp scanner/universe.json /tmp/out/ || true
          cd /tmp/out
          git init -q && git checkout -q -b res
          git config user.name "vp-scanner-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "research $(date -u +%F-%H%M) sha=${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" res:claude/research-results
