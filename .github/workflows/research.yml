name: Laboratorio (manual)

# Ejecuta manualmente el laboratorio de investigación (por defecto la validación final) con 10 años de
# datos del universo completo y vuelca el informe en la rama claude/research-results-<cmd>. No toca main.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'final | moc | improve | gap | pelotazo | pelotazo2 | explore | meta … meta5 | regime'
        default: 'final'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas lxml scikit-learn
      - name: Caché de precios
        uses: actions/cache@v4
        with:
          path: scanner/cache
          key: prices-v2-${{ github.run_id }}
          restore-keys: prices-v2-
      - name: Universo
        run: |
          cd scanner
          python universe.py --refresh || python universe.py
      - name: Investigación
        env:
          INPUT_CMD: ${{ github.event.inputs.cmd }}
        run: |
          mkdir -p /tmp/out
          cd scanner
          CMD="${INPUT_CMD:-final}"
          python -u research.py $CMD --out /tmp/out 2>&1 | tee /tmp/out/research_log.txt
      - name: Escaneo de prueba con el registro recién generado (datos reales)
        run: |
          if [ -f /tmp/out/validated.json ]; then
            cd scanner
            python -u scan.py --registry /tmp/out/validated.json --out /tmp/out/scan --no-notify 2>&1 | tee /tmp/out/scan_log.txt
          fi
      - name: Publicar resultados en rama aparte
        if: always()
        env:
          INPUT_CMD: ${{ github.event.inputs.cmd }}
        run: |
          cp scanner/universe.json /tmp/out/ || true
          cd /tmp/out
          git init -q && git checkout -q -b res
          git config user.name "vp-scanner-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "research $(date -u +%F-%H%M) sha=${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" res:claude/research-results-${INPUT_CMD:-final}
