name: Laboratorio y estudio (manual)

# Ejecuta a mano el laboratorio (analiza la lista de seguimiento) o el estudio de evidencia (S&P 500 + Nasdaq-100, 10 años) y vuelca el resultado
# en la rama claude/research-results-<cmd>. No toca la rama desde la que se lanza.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'lab (analiza la lista de seguimiento y vuelca las series completas) | study (estudio de evidencia) | plan (estudio del plan completo con stop y objetivo) | ml (aprendizaje automático fuera de muestra) | context (contexto, confluencia y meta-etiquetado) | search (búsqueda de la regla que más gana sobre el azar, con selección hacia delante) | confirm (evalúa en el universo elegido las reglas candidatas fijadas de antemano) | screen (cribador: qué acciones cumplen hoy las reglas candidatas)'
        default: 'lab'
      symbols:
        description: 'valores separados por comas (vacío = lista por defecto del lab o S&P 500 + Nasdaq-100 en el estudio)'
        default: ''
      reps:
        description: 'study, context y search: desplazamientos temporales del umbral del mejor de N (search: repeticiones del nulo del procedimiento, 30 por defecto)'
        default: '150'
      members:
        description: 'search: asof (cada valor del S&P 500 solo desde su incorporación al índice) | today (miembros actuales en todo el periodo: con sesgo de supervivencia)'
        default: 'asof'
      universe:
        description: 'study: large (S&P 500 + Nasdaq-100) | smallmid (S&P 400 + 600) | mixed (cripto, divisas, materias primas, índices)'
        default: 'large'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas lxml scikit-learn
      - name: Caché de precios
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: prices-vp-${{ github.run_id }}
          restore-keys: prices-vp-
      - name: Pruebas
        run: python tests/test_vp.py
      - name: Ejecutar
        env:
          INPUT_CMD: ${{ github.event.inputs.cmd }}
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
          INPUT_REPS: ${{ github.event.inputs.reps }}
          INPUT_UNIVERSE: ${{ github.event.inputs.universe }}
          INPUT_MEMBERS: ${{ github.event.inputs.members }}
        run: |
          set -o pipefail
          mkdir -p /tmp/out
          CMD="${INPUT_CMD:-lab}"
          if [ "$CMD" = "lab" ]; then
            python -u -m vp lab --symbols "$INPUT_SYMBOLS" --out /tmp/out --raw /tmp/out/raw 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "context" ]; then
            python -u -m vp context --symbols "$INPUT_SYMBOLS" --out /tmp/out --reps "${INPUT_REPS:-100}" 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "screen" ]; then
            python -u -m vp screen --symbols "$INPUT_SYMBOLS" --out /tmp/out 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "confirm" ]; then
            python -u -m vp search --confirm --symbols "$INPUT_SYMBOLS" --universe "${INPUT_UNIVERSE:-smallmid}" --out /tmp/out --reps "${INPUT_REPS:-300}" --members "${INPUT_MEMBERS:-asof}" 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "search" ]; then
            python -u -m vp search --symbols "$INPUT_SYMBOLS" --out /tmp/out --reps "${INPUT_REPS:-30}" --members "${INPUT_MEMBERS:-asof}" 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "ml" ]; then
            python -u -m vp ml --symbols "$INPUT_SYMBOLS" --out /tmp/out 2>&1 | tee /tmp/out/log.txt
          elif [ "$CMD" = "plan" ]; then
            python -u -m vp plan --symbols "$INPUT_SYMBOLS" --out /tmp/out 2>&1 | tee /tmp/out/log.txt
          else
            python -u -m vp study --symbols "$INPUT_SYMBOLS" --universe "${INPUT_UNIVERSE:-large}" --out /tmp/out --reps "${INPUT_REPS:-150}" 2>&1 | tee /tmp/out/log.txt
          fi
      - name: Publicar resultados en rama aparte
        if: always()
        env:
          INPUT_CMD: ${{ github.event.inputs.cmd }}
          INPUT_UNIVERSE: ${{ github.event.inputs.universe }}
          INPUT_MEMBERS: ${{ github.event.inputs.members }}
        run: |
          cd /tmp/out
          BR="${INPUT_CMD:-lab}"
          if [ "$BR" = "confirm" ]; then BR="confirm-${INPUT_UNIVERSE:-smallmid}"; fi
          if [ "$BR" = "search" ] && [ -n "$INPUT_MEMBERS" ] && [ "$INPUT_MEMBERS" != "asof" ]; then BR="search-$INPUT_MEMBERS"; fi
          if [ "$BR" = "study" ] && [ -n "$INPUT_UNIVERSE" ] && [ "$INPUT_UNIVERSE" != "large" ]; then BR="study-$INPUT_UNIVERSE"; fi
          git init -q && git checkout -q -b res
          git config user.name "vp-scanner-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "research ${INPUT_CMD:-lab} $(date -u +%F-%H%M) sha=${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" res:claude/research-results-${BR}
      - name: Guardar caché (también si falla)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: prices-vp-${{ github.run_id }}
