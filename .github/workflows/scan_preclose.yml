name: Scan previo al cierre

# Aviso ~30 min antes del cierre de Wall Street para comprar AL CIERRE con una orden MOC (límite NYSE 15:50 ET).
#
# El disparo programado de GitHub llega entre 3 y 6,5 horas tarde (medido en octubre de 2026), así que NO se programa a la hora del aviso:
# se lanza por la mañana (UTC) y el trabajo «esperar» duerme hasta que se abre la ventana 15:10–15:40 ET (la hora de Nueva York la calcula
# scanner/preclose_wait.py, con cambio de horario incluido). Si faltan más de 5,5 h, duerme un tramo y se relanza a sí mismo con workflow_dispatch
# (los relanzamientos por workflow_dispatch con el token del workflow sí arrancan, y arrancan al momento).
# Fuera de la ventana (fin de semana, ya pasó, ya se escaneó hoy) no hace nada y termina en verde.
on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar la ventana horaria (pruebas)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  esperar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: preclose-espera
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.d.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Esperar a la ventana (o decidir que no toca)
        id: d
        env:
          FORCE: ${{ inputs.force }}
        run: python -u scanner/preclose_wait.py
      - name: "Relevo (faltan horas, seguir esperando en una ejecución nueva)"
        if: steps.d.outputs.decision == 'hop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan_preclose.yml --ref "${GITHUB_REF_NAME}"

  escanear:
    needs: esperar
    if: needs.esperar.outputs.decision == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ¿Ya se escaneó hoy?
        id: chk
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "done=false" >> "$GITHUB_OUTPUT"; else python -u scanner/preclose_wait.py --check-done; fi
      - name: Dependencias
        if: steps.chk.outputs.done != 'true'
        run: pip install numpy pandas
      - name: Escanear (previo al cierre)
        if: steps.chk.outputs.done != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          cd scanner
          python -u scan.py --mode preclose $([ "$FORCE" = "true" ] && echo --force)
      - name: Guardar datos
        if: steps.chk.outputs.done != 'true'
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A scanner/data
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: scan previo $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
