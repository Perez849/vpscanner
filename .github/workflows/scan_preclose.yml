name: Scan previo al cierre

# Aviso ~30 min antes del cierre de Wall Street para comprar AL CIERRE con una orden MOC (límite NYSE 15:50 ET).
# GitHub programa en UTC: se lanza a las 15:20 ET tanto en horario de verano (19:20 UTC) como de invierno (20:20 UTC);
# el script comprueba la hora de Nueva York y se detiene si no está en la ventana 15:10–15:40 ET.
on:
  schedule:
    - cron: '20 19 * * 1-5'
    - cron: '20 20 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignorar la ventana horaria (pruebas)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  preclose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install numpy pandas
      - name: Escanear (previo al cierre)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          cd scanner
          python -u scan.py --mode preclose $([ "$FORCE" = "true" ] && echo --force)
      - name: Guardar datos
        run: |
          git config user.name  "vp-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scanner/data/alerts_pre.json scanner/data/tracking.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: scan previo $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push
          fi
