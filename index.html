<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<title>VP Scanner</title>
<style>
/* Distribución: cabecera con navegación · radar en tarjetas · gráfico con carril de valores y panel · evidencia · guía */
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#171a20; --sub:#646b78; --dim:#9aa1ad;
  --rule:#e9e7e0; --rule2:#dedbd1; --ink2:#f2f1ec; --ink3:#faf9f6;
  --emerald:#0d9455; --ember:#d23b3b; --amber:#d28a00; --cyan:#0a8aa8; --sapphire:#2563eb; --violet:#7c3aed;
  --cu:#0d9455; --cd:#d23b3b; --grid:#0000000e; --axis:#646b78;
  --gbg:#e3f5ea; --gfg:#0b7340; --rbg:#fbe8e8; --rfg:#a82828; --abg:#fdf1d9; --afg:#835400;
  --f-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --f-text:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --f-mono:'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --card:#1b1e24; --ink:#eceae3; --sub:#9aa1ad; --dim:#6a717d; --rule:#262a32; --rule2:#303540; --ink2:#22262d; --ink3:#191c21;
    --emerald:#2fbf7a; --ember:#ef5b5b; --amber:#e8b64a; --cyan:#38bdd8; --sapphire:#6c9cff; --violet:#a78bfa; --cu:#2fbf7a; --cd:#ef5b5b; --grid:#ffffff10; --axis:#9aa1ad;
    --gbg:#12301f; --gfg:#5fd69b; --rbg:#3a1a1a; --rfg:#f08585; --abg:#352a10; --afg:#e8b64a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --card:#1b1e24; --ink:#eceae3; --sub:#9aa1ad; --dim:#6a717d; --rule:#262a32; --rule2:#303540; --ink2:#22262d; --ink3:#191c21;
  --emerald:#2fbf7a; --ember:#ef5b5b; --amber:#e8b64a; --cyan:#38bdd8; --sapphire:#6c9cff; --violet:#a78bfa; --cu:#2fbf7a; --cd:#ef5b5b; --grid:#ffffff10; --axis:#9aa1ad;
  --gbg:#12301f; --gfg:#5fd69b; --rbg:#3a1a1a; --rfg:#f08585; --abg:#352a10; --afg:#e8b64a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1560px;margin:0 auto;padding-block:12px 36px}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

/* sección: dos partes grandes (figuras y velas · regla de impulso) */
.sec{display:flex;gap:6px;flex-wrap:wrap}
.sec button{font-family:var(--f-display);font-size:15px;font-weight:700;padding:8px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.1}
.sec button small{display:block;font-family:var(--f-mono);font-size:9px;font-weight:400;letter-spacing:.04em;text-transform:uppercase;opacity:.75;margin-top:3px}
.sec button.on{background:var(--ink);color:var(--bg)}
.sec button.i{border-color:var(--violet)}.sec button.i.on{background:var(--violet);color:#fff}
body.imp .top{border-bottom-color:var(--violet)}
body.imp .nav button.on{background:var(--violet);color:#fff}
.sumry.w .stat{flex:1 1 150px}
.part.f{background:var(--ink);color:var(--bg)}
.part{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--violet);color:#fff;margin-right:8px;vertical-align:middle}
table.ev td.l,table.ev th.l{text-align:left;white-space:normal}
.yb{display:inline-block;vertical-align:middle}
.cond{font-size:11.5px;color:var(--sub);line-height:1.5}
.pos{color:var(--emerald);font-weight:700}.neg{color:var(--ember);font-weight:700}
/* cabecera */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:4px 0 12px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.015em;text-decoration:none;line-height:1}
.brand b{color:var(--emerald);font-weight:800;margin-left:1px}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-top:4px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{font-family:var(--f-mono);font-size:12px;padding:8px 14px;border:1px solid transparent;border-radius:8px;background:none;color:var(--sub);cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg);font-weight:700}
.asof{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--sub);text-align:right}
.warn{background:var(--card);border:1px solid var(--rule2);border-left:3px solid var(--amber);border-radius:var(--r);padding:9px 13px;font-size:12px;color:var(--sub);margin:12px 0}
.warn b{color:var(--ink)}
.empty{padding:26px 14px;text-align:center;color:var(--sub);font-size:13px}
h2{font-family:var(--f-display);font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-size:16px;margin:0 0 6px}
.lead{color:var(--sub);font-size:13px;max-width:78ch;margin:0 0 10px}
.tag{font-family:var(--f-mono);font-size:10px;padding:2px 7px;border-radius:5px;background:var(--ink2);color:var(--sub);white-space:nowrap}
.tag.live{background:var(--sapphire);color:#fff}.tag.form{background:var(--amber);color:#1a1d23}
.tag.qh{background:var(--gbg);color:var(--gfg)}.tag.qm{background:var(--abg);color:var(--afg)}.tag.ql{background:var(--rbg);color:var(--rfg)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:8px;overflow:hidden}
.seg button{font-family:var(--f-mono);font-size:11px;padding:6px 10px;border:0;background:var(--card);color:var(--sub);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.tg{font-family:var(--f-mono);font-size:11px;padding:6px 10px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--sub);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px}
.tg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
.tg.on{color:var(--ink);border-color:var(--ink);font-weight:700}.tg.on i{opacity:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.sep{width:1px;height:22px;background:var(--rule2);margin:0 2px}
input[type=search],.sym-in{font-family:var(--f-mono);font-size:13px;padding:7px 10px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}

/* radar */
.sumry{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:8px 14px;min-width:130px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.stat span{font-family:var(--f-mono);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:6px}
.sc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.sc:hover{border-color:var(--ink)}
.sc-h{display:flex;align-items:baseline;gap:8px}
.sc-h b{font-family:var(--f-display);font-size:19px}
.sc-h .nm{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sc-p{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}
.sc svg{display:block;width:100%;height:42px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:10px;padding:2px 7px;border-radius:5px;background:var(--ink2);color:var(--sub);white-space:nowrap}
.chip.u{background:var(--gbg);color:var(--gfg)}.chip.d{background:var(--rbg);color:var(--rfg)}.chip.f{background:var(--abg);color:var(--afg)}.chip.n{background:var(--sapphire);color:#fff}
.fav{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;padding:0 2px;color:var(--dim)}.fav:hover{color:var(--amber)}.fav.on{color:var(--amber)}
.tag.new{background:var(--sapphire);color:#fff}.tag.spent{background:var(--rbg);color:var(--rfg)}

/* gráfico */
.chartwrap{display:grid;grid-template-columns:176px minmax(0,1fr) 350px;gap:12px;align-items:start}
.rail{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);max-height:calc(100vh - 150px);min-height:420px;overflow:auto}
.rail button{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;border:0;border-bottom:1px solid var(--rule);background:none;cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:11px}
.rail button:hover{background:var(--ink2)}.rail button.on{background:var(--ink);color:var(--bg)}
.rail .bd{margin-left:auto;display:flex;gap:3px}
.rail .bd i{font-style:normal;font-size:9px;padding:1px 5px;border-radius:4px;background:var(--ink2);color:var(--sub)}
.rail button.on .bd i{background:#ffffff26;color:inherit}
.rail .bd i.f{background:var(--amber);color:#1a1d23}
.rail .bd i.fv{background:none;color:var(--amber);padding:0 1px;font-size:11px}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:8px}
.price{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.price small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--sub);margin-left:8px}
.meta{font-family:var(--f-mono);font-size:11px;color:var(--sub);margin-left:auto;text-align:right}
#stage{position:relative;height:640px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;touch-action:none;cursor:crosshair}
#cv{position:absolute;inset:0;width:100%;height:100%}
#tip{position:absolute;display:none;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:11px;padding:7px 9px;border-radius:7px;line-height:1.45;z-index:5;max-width:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10px;color:var(--sub);padding:8px 2px}
.legend s{display:inline-block;width:14px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:4px;text-decoration:none}
.legend u{display:inline-block;width:10px;height:10px;opacity:.5;vertical-align:middle;margin-right:4px;border-radius:2px}
.side{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:420px}
.tabs{display:flex;border-bottom:1px solid var(--rule2)}
.tabs button{flex:1;font-family:var(--f-mono);font-size:11px;padding:10px 4px;border:0;background:none;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.pane{overflow:auto;padding:8px;flex:1}
.pc{border:1px solid var(--rule);border-radius:9px;padding:8px 10px;margin-bottom:7px;cursor:pointer;background:var(--card)}
.pc:hover{border-color:var(--dim)}.pc.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pc-s{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;color:var(--sub);margin-top:3px}
.res.t{color:var(--emerald)}.res.s{color:var(--ember)}.res.o{color:var(--sapphire)}.res.f{color:var(--amber)}
.small{font-size:11.5px;color:var(--sub);line-height:1.5}
.lv{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;margin:8px 0}
.lv td{padding:3px 0;border-bottom:1px solid var(--rule)}.lv td:last-child{text-align:right;font-weight:700}
.verdict{border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;line-height:1.45}
.verdict.g{background:var(--gbg);color:var(--gfg)}.verdict.r{background:var(--rbg);color:var(--rfg)}.verdict.a{background:var(--abg);color:var(--afg)}.verdict.n{background:var(--ink2);color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px;margin:6px 0}
.kv span:nth-child(odd){color:var(--sub);font-family:var(--f-mono);font-size:11px}
.kv span:nth-child(even){font-weight:600}

/* evidencia y guía */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.verd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.verd .big{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:800}
#strip{width:100%;height:310px;display:block}
table.ev{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11.5px}
table.ev th{position:sticky;top:0;background:var(--card);text-align:right;padding:6px 8px;border-bottom:2px solid var(--ink);cursor:pointer;white-space:nowrap;font-weight:700;color:var(--sub)}
table.ev th:first-child,table.ev td:first-child{text-align:left}
table.ev td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.ev tr:hover td{background:var(--ink2)}
.tw{overflow:auto;max-height:620px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card)}
.pos{color:var(--gfg)}.neg{color:var(--rfg)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;min-width:0}
.gc h4{margin:0 0 4px;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gc p{margin:4px 0;font-size:12px;color:var(--sub)}
.gc .rl{font-size:11.5px;border-left:3px solid var(--rule2);padding-left:8px;color:var(--ink)}
.pathbox{margin:8px 0 2px}.pathbox svg{display:block;width:100%;height:auto}.pathbox .cap{font-size:10.5px;color:var(--sub);line-height:1.4}
.foot{font-size:11px;color:var(--dim);padding:18px 0 4px;max-width:90ch}

@media (max-width:1250px){.chartwrap{grid-template-columns:minmax(0,1fr) 340px}.rail{display:none}}
@media (max-width:1000px){.chartwrap{grid-template-columns:minmax(0,1fr)}.side{max-height:none}#stage{height:520px}}
@media (max-width:700px){#stage{height:430px}.asof{margin-left:0;text-align:left}.bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.bar>*{flex:none}.warn{display:none}.meta{display:none}.price{font-size:22px}.stat{min-width:100px;padding:6px 10px}.stat b{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#radar" id="brand">VP<b>Scanner</b><small>laboratorio de chartismo y reglas</small></a>
    <nav class="sec" id="sec"></nav>
    <nav class="nav" id="nav"></nav>
    <div class="asof" id="asof"></div>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const DAY = 86400000, BASE = 'data/';
const FAMS = {figuras: 'Figuras', rupturas: 'Rupturas', velas: 'Velas', directrices: 'Directrices', rebotes: 'Rebotes en S/R'};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fx = (x, d = 2) => x == null || !isFinite(x) ? '—' : (Math.abs(x) >= 1000 ? x.toLocaleString('es-ES', {maximumFractionDigits: 0}) : x.toFixed(Math.abs(x) < 10 ? Math.max(d, 2) : d));
const pc = (x, d = 1) => x == null || !isFinite(x) ? '—' : (x >= 0 ? '+' : '') + x.toFixed(d) + ' %';
const dstr = d => new Date(d * DAY).toISOString().slice(0, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mon = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const S = {
  view: 'radar', idx: null, cat: null, ev: null, sym: null, D: null, sel: null, hover: null, tab: 'act', cross: null, cache: {},
  rv: {mode: 'all', dir: 0, q: 60, all: 0, text: '', fav: 0},                                   // filtros del radar
  f: {figuras: 1, rupturas: 1, velas: 1, directrices: 0, rebotes: 0, sr: 1, sma: 1, vol: 1, rr: 0, hist: 0, dir: 0, act: 0, stop: 'a', q: 60},   // filtros del gráfico
  view_: {start: 0, ppb: 6}, hits: [], W: 0, H: 0, dpr: 1,
  evK: 'K300', evFam: 'all', evSort: 't', evDir: -1, evText: '',
  imp: null, srch: null, cf: null, cfm: null, iv: {rule: 'all', fresh: 0, text: ''}                                   // parte 2: cribador, búsqueda y confirmaciones
};

/* favoritos: solo viven en este navegador (localStorage) */
const favs = (() => { try { return new Set(JSON.parse(localStorage.getItem('vp.favs') || '[]')); } catch (e) { return new Set(); } })();
function toggleFav(sym) {
  favs.has(sym) ? favs.delete(sym) : favs.add(sym);
  try { localStorage.setItem('vp.favs', JSON.stringify([...favs])); } catch (e) { /* sin almacenamiento: se mantiene mientras la página siga abierta */ }
}
const NEAR = 1.5;                                                            // «cerca del disparo»: a ≤ 1,5 ATR del nivel que activa la figura
const distTxt = d => d == null ? '' : d < 0.1 ? 'en el disparo' : `a ${d.toFixed(1)} ATR`;

/* ───────────────────────── datos ───────────────────────── */
async function J(path) {
  if (window.VP) { const k = path.replace(/\.json$/, ''); if (['impulso', 'search', 'search_confirm', 'search_confirm_smallmid'].includes(k)) return VP[k]; return k === 'index' ? VP.index : k === 'catalog' ? VP.catalog : k === 'evidence' ? VP.evidence : VP.charts[k.replace('charts/', '')]; }
  if (S.cache[path]) return S.cache[path];
  const r = await fetch(BASE + path + '?v=' + Math.floor(Date.now() / 3600000));
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return S.cache[path] = await r.json();
}
const catOf = k => (S.cat && S.cat.patterns[k]) || {};
const evOf = k => S.ev && S.ev.patterns ? {all: S.ev.patterns[k], hq: S.ev.patterns[k + ':hq']} : {};
const pathOf = k => { const P = S.ev && S.ev.paths && S.ev.paths[k]; if (!P) return null; const a = P.K300 && P.K300.n >= 30 ? P.K300 : P.K50 && P.K50.n >= 20 ? P.K50 : null; return a ? {...a, K: P.K300 === a ? 300 : 50} : null; };
function pathSvg(ps) {
  if (!ps) return '';
  const m = ps.m, se = ps.se, n = m.length, W = 300, H = 104, L = 30, R = 6, T = 8, B = 18;
  const lo = Math.min(0, ...m.map((v, i) => v - 1.96 * (se[i] || 0))), hi = Math.max(0, ...m.map((v, i) => v + 1.96 * (se[i] || 0))), pad = (hi - lo) * 0.08 || 0.1;
  const x = i => L + i / (n - 1) * (W - L - R), y = v => T + (hi + pad - v) / (hi - lo + 2 * pad) * (H - T - B), up = m[n - 1] >= 0, c = up ? 'var(--emerald)' : 'var(--ember)';
  const band = m.map((v, i) => `${x(i).toFixed(1)},${y(v + 1.96 * (se[i] || 0)).toFixed(1)}`).concat(m.map((v, i) => `${x(n - 1 - i).toFixed(1)},${y(m[n - 1 - i] - 1.96 * (se[n - 1 - i] || 0)).toFixed(1)}`)).join(' ');
  const line = m.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const sig = Math.abs(m[n - 1]) > 1.96 * (se[n - 1] || 1e9);
  return `<div class="pathbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trayectoria media tras el patrón"><line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--dim)" stroke-dasharray="3 3"/>
    <polygon points="${band}" fill="${c}" opacity=".15"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(n - 1).toFixed(1)}" cy="${y(m[n - 1]).toFixed(1)}" r="3" fill="${c}"/>

    <div class="panel"><h3>Las cinco reglas (candidatas fijadas de antemano)</h3><div class="small"><b>C1 · C2 · C3</b>: ${esc(ruleTxt(['bajo_200', 'impulso12_alto'], ''))}. Salidas: C1 = stop 2,5 ATR + asegura +4 % + persigue a 3 ATR · C2 = stop 2,5 ATR + asegura +6 % + persigue a 4 ATR · C3 = cierre a 10 sesiones sin stop.<br><b>C4</b>: ${esc(ruleTxt(['impulso12_alto', 'confluencia_bajista'], ''))} · cierre a 10 sesiones.<br><b>C5</b>: ${esc(ruleTxt(['impulso12_alto', 'rsi2_bajo'], ''))} · cierre a 10 sesiones.</div></div>
    <div class="panel"><h3>Cómo se encontró sin engañarse</h3><div class="small"><ul style="margin:0;padding-left:18px"><li>Se probaron ${S.srch ? nf(S.srch.meta.pruebas) : '4.800'} reglas (combinaciones de 32 condiciones fijadas de antemano, en largo y corto, con 6 salidas). Si se prueban miles de reglas, la mejor siempre parece buena.</li>
      <li><b>Selección hacia delante</b>: cada año se elige la mejor regla con los datos anteriores y se mide en ese año; el resultado «fuera de muestra» es el del procedimiento completo.</li>
      <li><b>Control del procedimiento</b>: se repite todo con los resultados desplazados en el calendario; lo que «encuentra» así es lo que da el azar al buscar.</li>
      <li><b>Confirmación en acciones distintas</b> (S&amp;P 400 y 600) con cinco hipótesis fijadas antes de mirarlas.</li>

    <div class="panel"><h3>Condiciones usadas (todas con datos hasta el cierre del día; los percentiles son del día)</h3><div class="small"><ul style="margin:0;padding-left:18px;columns:2;column-gap:28px">${Object.keys(COND).map(cd).join('')}</ul></div></div>
    <div class="panel"><h3>Qué no es</h3><div class="small"><b>No es chartismo.</b> Los patrones (velas, figuras, rupturas) solo entran como una condición más («2 o más señales bajistas a la vez») y no añaden nada: con patrón o sin él la ventaja es la misma. Las estadísticas de las figuras están en la otra parte del laboratorio (Figuras y velas → Evidencia) y no se mezclan con estas.<br><b>No es una recomendación de inversión</b>: la ventaja estimada es pequeña, depende del sesgo de supervivencia que no se pudo quitar del todo y varía de un año a otro.<br><b>Seguimiento hacia delante</b>: el cribador guarda cada día qué acciones cumplían cada regla (<code>data/impulso_hist.json</code>) para medir, sin posibilidad de ajustar nada, qué pasó con ellas.</div></div>`;

async function loadSym(sym, selId) {
  S.D = await J('charts/' + sym + '.json');

  $('#sym').value = sym; setFav();
  try { history.replaceState(null, '', '#' + sym); } catch (e) {}
  $('#rail').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === sym));
  const on = $('#rail button.on'); if (on) on.scrollIntoView({block: 'nearest'});
  const n = S.D.n;
  S.view_.ppb = Math.max(3, Math.min(14, (S.W - 70) / 130 || 6));
  S.view_.start = Math.max(-5, n - Math.floor((S.W - 70) / S.view_.ppb) + 22);

    <h3 style="margin-top:12px">Qué pasó con las operaciones de este valor</h3>
    <div class="small">${!D.trades ? 'Este gráfico se generó antes del recuento por operaciones: se actualiza en el próximo escaneo.' : A.n ? `${A.n} operaciones cerradas en los últimos ${n} días: <b>${A.won}</b> terminaron con ganancia neta y <b>${A.lost}</b> con pérdida (${(A.won / A.n * 100).toFixed(0)} % ganadoras). Media ${pc(A.mean_net, 2)} neto por operación${A.mean_r != null ? ` (${A.mean_r > 0 ? '+' : ''}${A.mean_r.toFixed(2).replace('-', '−')} R)` : ''}, suma ${pc(A.sum_net, 1)}. Llegaron a asegurar +4 % ${A.tgt}, saltó el stop inicial en ${A.stp} y ${A.tmo} se cerraron por tiempo sin asegurar (${A.tmo_won} con ganancia).${A.avg_win != null ? ` Las ganadoras ganaron ${pc(A.avg_win, 2)} de media${A.avg_loss != null ? ` y las perdedoras ${pc(A.avg_loss, 2)}` : ''}.` : ''}` : 'Ninguna operación cerrada en la ventana.'}
      Cuentan todas las señales, ninguna se descarta. Una operación por valor: las ${roles.confirma + roles.contraria} señales que saltaron con otra operación ya abierta no suman${T.conflicts ? ` (${roles.contraria} eran contrarias a la operación abierta, en ${T.conflicts} operaciones: conflicto)` : ''}. Gana quien termina con ganancia neta, llegue o no al objetivo. Es la historia de un solo valor: sirve para mirar, no demuestra nada (eso es la pestaña Evidencia).</div>
    <div class="kv" style="margin-top:6px">${Object.entries(T.by_fam).map(([k, v]) => `<span>${FAMS[k] || k} (primera señal)</span><span>${v.n} op. · ${v.won} ganaron · ${pc(v.mean_net, 2)} de media</span>`).join('')}</div>
    <div class="small" style="margin-top:10px">Cómo se calcula: la señal se completa en el cierre de una barra y se entra en la apertura siguiente. Stop inicial: el estructural (al otro lado de la figura) si queda entre 1 y 2 ATR de la entrada; si está más lejos se acorta a 2 ATR. Cuando una sesión cierra a +4 % o más a favor, el stop sube a ese nivel y persigue al mejor cierre a 3 ATR (nunca baja de lo asegurado), hasta 60 sesiones. Todas las señales cuentan; los avisos (riesgo alto, stop más lejos que el +4 %) son solo informativos. El stop gana si se tocan ambos el mismo día; se descuenta el 0,15 % de costes del estudio.</div>`;
}
function renderPane() {
  if (!S.D || S.view !== 'chart') return;
  const act = S.D.patterns.filter(p => p.active && vis(p)).sort((a, b) => (b.state === 'forming') - (a.state === 'forming') || (b.q || 0) - (a.q || 0) || b.i - a.i), hist = S.D.patterns.filter(vis).slice().sort((a, b) => b.i - a.i);
  $('#tabs').innerHTML = [['act', `Activos (${act.length})`], ['hist', `Histórico (${hist.length})`], ['read', 'Lectura']].map(([k, t]) => `<button data-k="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.k; renderPane(); });
  const el = $('#pane');
  let h = S.sel ? cardFull(S.sel) : '';
  if (S.tab === 'act') h += act.length ? act.map(card).join('') : '<div class="empty">Ningún patrón completándose ahora con los filtros actuales.</div>';
  else if (S.tab === 'hist') h += hist.length ? hist.map(card).join('') : '<div class="empty">Sin patrones con estos filtros.</div>';
  else h += reading();
  el.innerHTML = h;
  el.querySelectorAll('[data-id]').forEach(e => e.onclick = ev => { if (ev.target.closest('#clr')) return; select(S.D.patterns.find(p => p.id === e.dataset.id), true); });
  const x = el.querySelector('#clr'); if (x) x.onclick = () => select(null);
}
function select(p, center) {
  S.sel = p && p === S.sel && !center ? null : p;
  if (S.sel && center) {
    const L = layout(), e = extents(S.sel), iA = Math.min(...e.xs), iB = S.sel.i + 30, w = L.x1 - L.x0;
    S.view_.ppb = Math.max(2.2, Math.min(12, w / (iB - iA + 10)));
    S.view_.start = iA - 5;
    if (S.view_.start + w / S.view_.ppb > S.D.n + 40) S.view_.start = S.D.n + 40 - w / S.view_.ppb;
    if (S.view_.start < -12) S.view_.start = -12;
  }
  draw(); renderPane();
  if (S.sel) { const pn = $('#pane'), el = pn.querySelector('.pc.sel'); if (el) pn.scrollTop = Math.max(0, el.offsetTop - pn.offsetTop - 6); }
}

/* ───────────────────────── entrada ───────────────────────── */
function hitAt(x, y) { for (let k = S.hits.length - 1; k >= 0; k--) { const h = S.hits[k].rc; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return S.hits[k].p; } return null; }
function setupInput() {
  const st = $('#stage'); let drag = null, pinch = null, moved = 0;
  const pos = e => { const r = st.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  const clampView = () => { const L = layout(), vn = (L.x1 - L.x0) / S.view_.ppb; S.view_.start = Math.max(-12, Math.min(S.view_.start, S.D.n - vn + 40)); };
  st.addEventListener('mousedown', e => { if (e.button) return; drag = {x: e.clientX, s: S.view_.start}; moved = 0; st.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', e => { if (drag && moved < 4) { const p = hitAt(pos(e).x, pos(e).y); if (p) select(p, false); else if (S.sel) select(null); } drag = null; st.style.cursor = ''; });
  window.addEventListener('mousemove', e => {
    if (!S.D || S.view !== 'chart') return;
    if (drag) { moved += Math.abs(e.movementX) + Math.abs(e.movementY); S.view_.start = drag.s - (e.clientX - drag.x) / S.view_.ppb; clampView(); S.cross = null; draw(); return; }
    const r = st.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { if (S.cross) { S.cross = null; draw(); } return; }
    const q = pos(e), p = hitAt(q.x, q.y);
    st.style.cursor = p ? 'pointer' : 'crosshair';
    S.cross = q; if (p !== S.hover) S.hover = p; draw(); tip(q, p);
  });
  st.addEventListener('mouseleave', () => { S.cross = null; S.hover = null; $('#tip').style.display = 'none'; draw(); });
  st.addEventListener('wheel', e => { e.preventDefault(); const q = pos(e), i = iFromX(q.x), f = Math.exp(-e.deltaY * 0.0015); S.view_.ppb = Math.max(1.6, Math.min(40, S.view_.ppb * f)); S.view_.start = i - (q.x - layout().x0) / S.view_.ppb + 0.5; clampView(); draw(); }, {passive: false});
  st.addEventListener('touchstart', e => { if (e.touches.length === 1) { drag = {x: e.touches[0].clientX, s: S.view_.start}; moved = 0; } else if (e.touches.length === 2) { drag = null; pinch = {d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), p: S.view_.ppb}; } }, {passive: true});
  st.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1 && drag) { moved += 1; S.view_.start = drag.s - (e.touches[0].clientX - drag.x) / S.view_.ppb; clampView(); draw(); } else if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); S.view_.ppb = Math.max(1.6, Math.min(40, pinch.p * d / pinch.d)); clampView(); draw(); } }, {passive: false});
  st.addEventListener('touchend', e => { if (drag && moved < 4 && e.changedTouches.length) { const r = st.getBoundingClientRect(), t = e.changedTouches[0], p = hitAt(t.clientX - r.left, t.clientY - r.top); if (p) select(p, false); } drag = null; pinch = null; });
}
function onKey(e) {
  if (e.target.tagName === 'INPUT' || S.view !== 'chart' || !S.D) return;
  if (e.key === 'Escape') select(null);
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.shiftKey) {
    const l = S.D.patterns.filter(vis).sort((a, b) => a.i - b.i);
    if (l.length) { const k = S.sel ? l.indexOf(S.sel) : -1; select(e.key === 'ArrowRight' ? l[Math.min(l.length - 1, k + 1)] : l[Math.max(0, (k < 0 ? l.length : k) - 1)], true); e.preventDefault(); }
  }
  const k = S.idx.symbols, i = k.findIndex(s => s.sym === S.sym);
  if (e.key === 'ArrowRight' && e.shiftKey) go(k[(i + 1) % k.length].sym);
  if (e.key === 'ArrowLeft' && e.shiftKey) go(k[(i - 1 + k.length) % k.length].sym);
}
function tip(q, p) {
  const el = $('#tip'), b = S.D.bars, i = Math.round(iFromX(q.x));
  if (i < 0 || i >= S.D.n) { el.style.display = 'none'; return; }
  let h = `<b>${dstr(b.t[i])}</b><br>A ${fx(b.o[i])} · M ${fx(b.h[i])}<br>m ${fx(b.l[i])} · C ${fx(b.c[i])} (${pc((b.c[i] / (b.c[i - 1] || b.o[i]) - 1) * 100)})`;
  if (p) { const r = rrOf(p); h += `<br><span style="color:${col(p.dir)}"><b>${esc(p.label)}</b></span>${p.q != null ? ' · Q ' + p.q : ''} · R:R ${r.rr != null ? r.rr.toFixed(1) : '—'}<br>${status(p)[1]}<br><i>clic para ver el detalle</i>`; }
  el.innerHTML = h; el.style.display = 'block';
  const w = el.offsetWidth; el.style.left = Math.min(q.x + 16, S.W - w - 8) + 'px'; el.style.top = Math.max(q.y - 70, 6) + 'px';
}
init();
</script>
