<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de gráficos</title>
<style>
  :root{
    --bg:#fbfbf9; --card:#ffffff; --ink:#1a1d23; --sub:#6b7280; --dim:#9ca3af;
    --rule:#eceae4; --rule2:#e2e0d8; --ink2:#f5f4f0; --ink3:#fafaf8;
    --emerald:#0f9d58; --ember:#d93838; --amber:#d99000; --cyan:#0891b2;
    --sapphire:#2563eb; --violet:#7c3aed;
    --cu:#0f9d58; --cd:#d93838; --grid:#00000010; --axis:#6b7280;
    --gbg:#e6f6ec; --gfg:#0d7a45; --rbg:#fbe9e9; --rfg:#b02a2a; --abg:#fdf3dc; --afg:#8a5a00;
    --f-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --f-text:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --f-mono:'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#14161a;--card:#1c1f25;--ink:#eceae4;--sub:#9aa0aa;--dim:#6b7280;--rule:#272b33;--rule2:#30343d;--ink2:#23272e;--ink3:#1a1d22;
          --emerald:#2fbf7a;--ember:#ef5b5b;--amber:#e8b64a;--cyan:#38bdd8;--sapphire:#6c9cff;--violet:#a78bfa;--cu:#2fbf7a;--cd:#ef5b5b;--grid:#ffffff12;--axis:#9aa0aa;--gbg:#12301f;--gfg:#5fd69b;--rbg:#3a1a1a;--rfg:#f08585;--abg:#352a10;--afg:#e8b64a;color-scheme:dark;}
  }
  :root[data-theme="dark"]{--bg:#14161a;--card:#1c1f25;--ink:#eceae4;--sub:#9aa0aa;--dim:#6b7280;--rule:#272b33;--rule2:#30343d;--ink2:#23272e;--ink3:#1a1d22;
          --emerald:#2fbf7a;--ember:#ef5b5b;--amber:#e8b64a;--cyan:#38bdd8;--sapphire:#6c9cff;--violet:#a78bfa;--cu:#2fbf7a;--cd:#ef5b5b;--grid:#ffffff12;--axis:#9aa0aa;--gbg:#12301f;--gfg:#5fd69b;--rbg:#3a1a1a;--rfg:#f08585;--abg:#352a10;--afg:#e8b64a;color-scheme:dark;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1500px;margin:0 auto;padding:14px 16px 40px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0 12px;border-bottom:2px solid var(--ink)}
  h1{font-family:var(--f-display);font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}
  .meta{font-family:var(--f-mono);font-size:11px;color:var(--sub);margin-left:auto;text-align:right}
  .sym-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sym-box input,.sym-box select{font-family:var(--f-mono);font-size:14px;font-weight:700;padding:7px 10px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--ink);width:130px;text-transform:uppercase}
  .price{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
  .price small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--sub);margin-left:8px}
  .warn{background:var(--card);border:1px solid var(--rule2);border-left:3px solid var(--amber);border-radius:var(--r);padding:9px 13px;font-size:12px;color:var(--sub);margin:10px 0}
  .warn b{color:var(--ink)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .tg{font-family:var(--f-mono);font-size:11px;padding:6px 10px;border:1px solid var(--rule2);border-radius:8px;background:var(--card);color:var(--sub);cursor:pointer;user-select:none;display:inline-flex;gap:6px;align-items:center}
  .tg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
  .tg.on{color:var(--ink);border-color:var(--ink);font-weight:700}
  .tg.on i{opacity:1}
  @media (max-width:700px){.bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.bar>*{flex:none}.warn{font-size:11px}}
  .seg{display:flex;border:1px solid var(--rule2);border-radius:8px;overflow:hidden}
  .seg button{font-family:var(--f-mono);font-size:11px;padding:6px 10px;border:0;background:var(--card);color:var(--sub);cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
  .sep{width:1px;height:22px;background:var(--rule2);margin:0 2px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;align-items:start}
  @media (max-width:1050px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--rule2);border-radius:var(--r)}
  #stage{position:relative;height:640px;overflow:hidden;touch-action:none}
  @media (max-width:700px){#stage{height:520px}}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--rule2);border-radius:8px;padding:7px 10px;font-family:var(--f-mono);font-size:11px;box-shadow:0 4px 18px #0002;display:none;z-index:3;max-width:260px}
  #tip b{font-weight:700}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;color:var(--sub);padding:8px 12px;border-top:1px solid var(--rule2)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend s{display:inline-block;width:16px;height:0;border-top:2px solid currentColor}
  .legend s.d{border-top-style:dashed}
  .legend u{display:inline-block;width:12px;height:9px;border-radius:2px;opacity:.5;text-decoration:none}
  .side{display:flex;flex-direction:column;gap:12px;max-height:calc(640px + 40px);overflow:auto}
  @media (max-width:1050px){.side{max-height:none}}
  .tabs{display:flex;border-bottom:1px solid var(--rule2)}
  .tabs button{flex:1;font-family:var(--f-mono);font-size:11px;padding:10px 4px;border:0;background:none;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  .pane{padding:10px;max-height:560px;overflow:auto}
  .pc{border:1px solid var(--rule2);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer;background:var(--card)}
  .pc:hover{border-color:var(--sapphire)}
  .pc.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
  .pc-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%}
  .tag{font-family:var(--f-mono);font-size:9.5px;padding:1px 6px;border-radius:5px;background:var(--ink2);color:var(--sub);font-weight:700;letter-spacing:.03em}
  .tag.live{background:var(--sapphire);color:#fff}
  .tag.form{background:var(--amber);color:#1a1d23}
  .tag.qh{background:var(--gbg);color:var(--gfg)}.tag.qm{background:var(--abg);color:var(--afg)}.tag.ql{background:var(--rbg);color:var(--rfg)}
  .pc-s{font-family:var(--f-mono);font-size:10.5px;color:var(--sub);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .res{font-family:var(--f-mono);font-size:10.5px;font-weight:700}
  .res.t{color:var(--emerald)}.res.s{color:var(--ember)}.res.o{color:var(--sapphire)}.res.x{color:var(--sub)}
  table.lv{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;margin:8px 0}
  table.lv td{padding:3px 0}table.lv td:last-child{text-align:right;font-weight:700}
  .verdict{border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;line-height:1.45}
  .verdict.g{background:var(--gbg);color:var(--gfg)}.verdict.r{background:var(--rbg);color:var(--rfg)}.verdict.a{background:var(--abg);color:var(--afg)}.verdict.n{background:var(--ink2);color:var(--sub)}
  .small{font-size:11.5px;color:var(--sub)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--f-mono);font-size:11.5px;margin:6px 0}
  .kv span:nth-child(odd){color:var(--sub)}
  h3{font-family:var(--f-display);font-size:16px;margin:2px 0 6px}
  .empty{color:var(--sub);font-size:12.5px;padding:18px 6px;text-align:center}
  .top{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
  .chip{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:7px;background:var(--ink2);color:var(--sub);cursor:pointer}
  .chip.u{background:var(--gbg);color:var(--gfg)}.chip.d{background:var(--rbg);color:var(--rfg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="tag" style="text-decoration:none;padding:5px 9px" title="Volver al scanner">← Scanner</a>
    <h1>Laboratorio de gráficos</h1>
    <div class="sym-box">
      <input id="sym" list="symlist" placeholder="Valor" autocomplete="off" spellcheck="false">
      <datalist id="symlist"></datalist>
    </div>
    <div class="price" id="price"></div>
    <div class="meta" id="meta"></div>
    <span class="tag" id="png" style="cursor:pointer;padding:5px 9px" title="Descarga el gráfico como imagen">PNG ⤓</span>
  </header>
  <div class="warn" id="warn"></div>
  <div class="bar" id="bar"></div>
  <div class="grid">
    <div class="card">
      <div id="stage"><canvas id="cv"></canvas><div id="tip"></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="side">
      <div class="card">
        <div class="tabs" id="tabs"></div>
        <div class="pane" id="pane"></div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const DAY = 86400000;
const BASE = 'scanner/data/charts/';
const FAMS = {figuras:'Figuras', rupturas:'Rupturas', velas:'Velas', directrices:'Directrices', rebotes:'Rebotes en S/R'};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fx = (x, d = 2) => x == null || !isFinite(x) ? '—' : (Math.abs(x) >= 1000 ? x.toLocaleString('es-ES', {maximumFractionDigits: 0}) : x.toFixed(Math.abs(x) < 10 ? Math.max(d, 2) : d));
const pc = (x, d = 1) => x == null || !isFinite(x) ? '—' : (x >= 0 ? '+' : '') + x.toFixed(d) + ' %';
const dstr = d => new Date(d * DAY).toISOString().slice(0, 10);
const mon = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const S = {
  idx: null, sym: null, D: null, sel: null, hover: null, tab: 'act', cross: null,
  view: {start: 0, ppb: 6},                 // primera barra visible (decimal) y píxeles por barra
  f: {figuras: 1, rupturas: 1, velas: 1, directrices: 0, rebotes: 0, sr: 1, sma: 1, vol: 1, rr: 0, hist: 0, dir: 0, act: 0, stop: 'e', q: 60},
  hits: [], W: 0, H: 0, dpr: 1, cache: {}
};

/* ───────────────────────── datos ───────────────────────── */
async function getJSON(name) {
  if (window.CHARTLAB) return name === 'index' ? window.CHARTLAB.index : window.CHARTLAB.data[name];
  if (S.cache[name]) return S.cache[name];
  const r = await fetch(BASE + name + '.json?v=' + Math.floor(Date.now() / 3600000));
  if (!r.ok) throw new Error(name + ' ' + r.status);
  return S.cache[name] = await r.json();
}

async function init() {
  $('#warn').innerHTML = '<b>Herramienta para leer el gráfico, no una señal de compra.</b> Nuestro estudio de estos 65 patrones sobre las 50 y las 300 acciones de EE.UU. más negociadas (2017–2026, mejor de 65 corregido) <b>no encuentra ventaja</b>: las rupturas a máximos rinden menos que entrar al azar y los dibujos clásicos no baten al mercado. Cada patrón muestra su evidencia.';
  try { S.idx = await getJSON('index'); } catch (e) { $('#pane').innerHTML = '<div class="empty">No hay datos todavía. Lanza el flujo «Laboratorio» con el comando <b>chartlab</b> o ejecuta <code>python scanner/chartlab.py</code>.</div>'; return; }
  $('#symlist').innerHTML = S.idx.symbols.map(s => `<option value="${s.sym}">`).join('');
  buildBar();
  const h = (location.hash || '').replace('#', '').toUpperCase();
  const first = S.idx.symbols.find(s => s.sym === h) || S.idx.symbols[0];
  $('#sym').addEventListener('change', e => { const v = e.target.value.trim().toUpperCase(); if (S.idx.symbols.find(s => s.sym === v)) loadSym(v); });
  $('#sym').addEventListener('focus', e => e.target.select());
  window.addEventListener('resize', resize);
  setupInput();
  measure();
  await loadSym(first.sym);
}

async function loadSym(sym, selId) {
  S.D = await getJSON(sym);
  S.sym = sym; S.sel = null; S.hover = null;
  $('#sym').value = sym;
  history.replaceState(null, '', '#' + sym);
  const n = S.D.n;
  S.view.ppb = Math.max(3, Math.min(14, (S.W - 70) / 130 || 6));
  S.view.start = Math.max(-5, n - Math.floor((S.W - 70) / S.view.ppb) + 22);
  const sm = S.D.summary, last = S.D.bars.c.length - 1, c = S.D.bars.c;
  const ch = (c[last] / c[last - 1] - 1) * 100;
  $('#price').innerHTML = `${fx(sm.close)}<small style="color:${ch >= 0 ? 'var(--emerald)' : 'var(--ember)'}">${pc(ch)} · ATR ${fx(sm.atr)} (${sm.atrp} %) · RSI(14) ${sm.rsi14}</small>`;
  $('#meta').innerHTML = `datos hasta ${dstr(S.D.asof)}<br>${S.D.patterns.length} patrones · ${S.D.patterns.filter(p => p.active).length} activos`;
  resize();
  const act = S.D.patterns.filter(p => p.active && vis(p)), pick = (selId && S.D.patterns.find(p => p.id === selId)) || act.filter(p => p.fam === 'figuras').pop() || act.pop();
  if (pick) { S.tab = selId ? 'radar' : S.tab; select(pick, true); } else renderPane();
}

/* ───────────────────────── barra de filtros ───────────────────────── */
function buildBar() {
  const el = $('#bar');
  const tg = (k, label, color) => `<span class="tg ${S.f[k] ? 'on' : ''}" data-k="${k}"><i style="color:${color || 'currentColor'}"></i>${label}</span>`;
  el.innerHTML = Object.keys(FAMS).map(k => tg(k, FAMS[k])).join('') + '<span class="sep"></span>' + tg('sr', 'Soportes y resistencias') + tg('sma', 'Medias 50/200') + tg('vol', 'Volumen') + '<span class="sep"></span>' +
    tg('rr', 'Objetivo y stop de todos los activos') + tg('hist', 'Resultado de todos') + tg('act', 'Solo activos') +
    '<span class="sep"></span><div class="seg" id="sg-dir"><button data-v="0" class="on">Ambos</button><button data-v="1">Alcistas</button><button data-v="-1">Bajistas</button></div>' +
    '<div class="seg" id="sg-q" title="Calidad de la figura (0–100): toques, ajuste de las rectas, simetría, duración, ruptura y volumen"><button data-v="0">Calidad: todas</button><button data-v="60" class="on">≥ 60</button><button data-v="75">≥ 75</button></div>' +
    '<div class="seg" id="sg-stop" title="Stop estructural (bajo la figura) o táctico (1,5 ATR)"><button data-v="e" class="on">Stop estructural</button><button data-v="t">Stop táctico</button></div>' +
    '<div class="seg" id="sg-rng"><button data-v="63">3M</button><button data-v="126" class="on">6M</button><button data-v="252">1A</button><button data-v="999">Todo</button></div>';
  el.querySelectorAll('.tg').forEach(b => b.onclick = () => { const k = b.dataset.k; S.f[k] = S.f[k] ? 0 : 1; b.classList.toggle('on', !!S.f[k]); draw(); renderPane(); });
  const seg = (id, fn) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.v); });
  seg('#sg-dir', v => { S.f.dir = +v; draw(); renderPane(); });
  seg('#sg-q', v => { S.f.q = +v; draw(); renderPane(); });
  seg('#sg-stop', v => { S.f.stop = v; draw(); renderPane(); });
  seg('#sg-rng', v => { const n = S.D.n, k = Math.min(+v, n); S.view.ppb = Math.max(2.2, (S.W - 70) / (k + 24)); S.view.start = n - k - 2; draw(); });
}

/* ───────────────────────── utilidades de patrones ───────────────────────── */
const col = d => d > 0 ? css('--emerald') : d < 0 ? css('--ember') : css('--amber');
function vis(p) {
  if (p === S.sel) return true;
  if (!S.f[p.fam]) return false;
  if (p.q != null && p.q < S.f.q && p !== S.sel) return false;
  if (S.f.dir && p.dir !== S.f.dir) return false;
  if (S.f.act && !p.active && p !== S.sel) return false;
  return true;
}
/* Cajas de entrada/stop/objetivo: una por patrón cerrado; dos (ruptura al alza y a la baja) por figura en formación */
function boxesOf(p) {
  const tact = s => S.f.stop === 't' && s.stop_t != null;
  if (p.state === 'forming') return ['up', 'dn'].filter(k => p.sc[k]).map(k => { const s = p.sc[k], t = tact(s); return {k, d: k === 'up' ? 1 : -1, entry: s.entry, target: s.target, stop: t ? s.stop_t : s.stop, t1: s.t1, rr: t ? s.rr_t : s.rr, out: null, tact: t, sc: s}; });
  const t = tact(p.rr);
  return [{k: 'x', d: p.dir, entry: p.rr.entry, target: p.rr.target, stop: t ? p.rr.stop_t : p.rr.stop, t1: p.rr.t1, rr: t ? p.rr.rr_t : p.rr.rr, out: t ? p.out_t : p.out, tact: t}];
}
function rrOf(p) { return boxesOf(p)[0]; }
function status(p) { return p.state === 'forming' ? ['f', 'sin romper todavía'] : resTxt(rrOf(p).out); }
const qcls = q => q >= 70 ? 'qh' : q >= 50 ? 'qm' : 'ql';
const qtag = p => p.q == null ? '' : `<span class="tag ${qcls(p.q)}" title="Calidad de la figura (0–100)">Q ${p.q}</span>`;
function resTxt(o) {
  if (!o) return ['x', 'sin simular'];
  if (o.res === 'forming') return ['f', 'sin romper todavía'];
  if (o.res === 'target') return ['t', `✓ objetivo en ${o.bars} ses. (${pc(o.ret)})`];
  if (o.res === 'stop') return ['s', `✗ stop en ${o.bars} ses. (${pc(o.ret)})`];
  if (o.res === 'open') return ['o', o.ret == null ? 'recién completado' : `en curso (${pc(o.ret)})`];
  if (o.res === 'timeout') return ['x', `sin resolver en 40 ses. (${pc(o.ret)})`];
  return ['x', 'entrada ya fuera de niveles'];
}
function verdict(ev) {
  const m = (S.idx.stats_meta || {}), thr = (m.thr && m.thr.K300 && m.thr.K300.p95) || 3.3;
  if (!ev) return ['n', 'Este patrón no está en nuestro estudio (solo visualización).'];
  const e = ev.K300 && ev.K300.n >= 100 ? ev.K300 : (ev.K50 || null);
  if (!e || e.ex == null) return ['n', 'Muy pocas señales en el estudio para juzgarlo.'];
  const side = ev.dir > 0 ? 'largo' : 'corto';
  const head = `Estudio (acciones EE.UU. más negociadas, ${side}, 10 sesiones): `;
  if (e.t >= thr && e.ex > 0) return ['g', head + `ventaja frente al azar de ${pc(e.ex, 2)} por operación (t = ${e.t.toFixed(1)}, supera el umbral del mejor de 65).`];
  if (e.t <= -thr) return ['r', head + `rinde ${pc(e.ex, 2)} MENOS que entrar al azar (t = ${e.t.toFixed(1)}): comprar este patrón ha sido peor que no mirar el gráfico.`];
  if (e.ex > 0 && e.t >= 2) return ['a', head + `parece algo mejor que el azar (${pc(e.ex, 2)}, t = ${e.t.toFixed(1)}) pero no supera el umbral del mejor de 65: no concluyente.`];
  return ['n', head + `sin ventaja demostrada (exceso ${pc(e.ex, 2)}, t = ${e.t.toFixed(1)}).`];
}
function evHq(p) {
  const e = p.ev_hq && (p.ev_hq.K300 && p.ev_hq.K300.n >= 30 ? p.ev_hq.K300 : p.ev_hq.K50);
  if (p.q == null || !e || e.ex == null) return '';
  return `<div class="small" style="margin-top:6px"><b>Solo con calidad ≥ 75</b> (${p.q >= 75 ? 'esta figura lo cumple' : 'esta no lo cumple'}): n=${e.n} · acierto ${e.wr.toFixed(0)} % · exceso ${pc(e.ex, 2)} (t ${e.t.toFixed(1)}). ${Math.abs(e.t) >= 2 ? '' : 'Sin diferencia apreciable: dibujar mejor la figura no la hace más fiable.'}</div>`;
}
function evLines(ev) {
  if (!ev) return '';
  const row = (k, lab) => ev[k] && ev[k].n ? `<span>${lab}</span><span>n=${ev[k].n} · acierto ${ev[k].wr.toFixed(0)} % · media ${pc(ev[k].mean, 2)} · exceso ${pc(ev[k].ex, 2)} (t ${ev[k].t.toFixed(1)}) · años+ ${ev[k].pos}/${ev[k].tot}</span>` : '';
  return `<div class="kv">${row('K50', '50 mayores')}${row('K300', '300 mayores')}</div>`;
}

/* ───────────────────────── geometría del gráfico ───────────────────────── */
const M = {l: 8, r: 62, t: 14, b: 26};
function layout() {
  const volH = S.f.vol ? Math.round(S.H * 0.16) : 0;

  el.querySelectorAll('[data-go]').forEach(e => e.onclick = async () => { const [sym, id] = e.dataset.go.split('|'); await loadSym(sym, id); });
}
function card(p) {
  const r = rrOf(p), [rc, rt] = status(p), sel = p === S.sel, fm = p.state === 'forming';
  const rrt = fm ? 'dos escenarios' : 'R:R ' + (r.rr != null ? r.rr.toFixed(1) : '—');
  return `<div class="pc ${sel ? 'sel' : ''}" data-id="${p.id}"><div class="pc-h"><span class="dot" style="background:${fm ? 'var(--amber)' : col(p.dir)}"></span>${p.label}${fm ? '<span class="tag form">FORMÁNDOSE</span>' : p.active ? '<span class="tag live">ACTIVO</span>' : ''}${qtag(p)}<span class="tag">${p.fam}</span></div>
    <div class="pc-s"><span>${dstr(S.D.bars.t[p.i])}</span><span>${rrt}</span><span class="res ${rc}">${rt}</span></div></div>`;
}
const obsTxt = o => o && o.length ? `<div class="small" style="margin-top:4px"><b>En el camino al objetivo:</b> ${o.map(z => `${z.k === 'S' ? 'soporte' : 'resistencia'} ${fx(z.p)} (×${z.n})`).join(' · ')}. ${o.length >= 2 ? 'Varias barreras: el objetivo completo es poco probable sin pausas.' : 'El precio tiene que atravesarla.'}</div>` : '';
function scTable(s, d, lab) {
  const dd = d, pcs = x => pc((x / s.entry - 1) * 100 * dd);
  const bo = {entry: s.entry, stop: S.f.stop === 't' && s.stop_t != null ? s.stop_t : s.stop, rr: S.f.stop === 't' && s.rr_t != null ? s.rr_t : s.rr};
  const [vc, vt] = verdict(s.ev);
  return `<div class="small" style="margin-top:8px"><b style="color:var(--${d > 0 ? 'emerald' : 'ember'})">${d > 0 ? '▲ Ruptura al alza' : '▼ Ruptura a la baja'}</b> · ${lab}</div>
    <table class="lv"><tr><td>Entrada (cierre ${d > 0 ? '>' : '<'})</td><td>${fx(s.entry)}</td></tr><tr><td style="color:var(--emerald)">Objetivo</td><td>${fx(s.target)} (${pcs(s.target)})</td></tr>
    <tr><td style="color:var(--emerald)">T1 (50 %)</td><td>${fx(s.t1)} (${pcs(s.t1)})</td></tr>
    <tr><td style="color:var(--ember)">Stop${S.f.stop === 't' && s.stop_t != null ? ' táctico' : ' estructural'}</td><td>${fx(bo.stop)} (${pcs(bo.stop)})</td></tr><tr><td>Recompensa / riesgo</td><td>${bo.rr != null ? bo.rr.toFixed(2) : '—'}</td></tr></table>
    <div class="small">${s.note}</div>${obsTxt(s.obs)}<div class="verdict ${vc}">${vt}</div>`;
}
function cardFull(p) {
  const hd = `<div class="pc sel" style="cursor:default"><div class="pc-h"><span class="dot" style="background:${p.state === 'forming' ? 'var(--amber)' : col(p.dir)}"></span><span style="font-size:15px">${p.label}</span>${p.state === 'forming' ? '<span class="tag form">FORMÁNDOSE</span>' : p.active ? '<span class="tag live">ACTIVO</span>' : ''}${qtag(p)}<span style="margin-left:auto;cursor:pointer" id="clr" class="tag">cerrar ✕</span></div>`;
  if (p.state === 'forming') {
    return hd + `<div class="small" style="margin-top:3px">${p.desc} · a fecha ${dstr(S.D.bars.t[p.i])}</div><div class="small">${p.note}</div>` + (p.sc.up ? scTable(p.sc.up, 1, p.sc.up.label) : '') + (p.sc.dn ? scTable(p.sc.dn, -1, p.sc.dn.label) : '') +
      `<div class="small" style="margin-top:8px">Las dos rectas se ajustan con los pivotes que el precio respeta; la entrada es el valor de cada recta en la próxima sesión (+0,15 ATR). Si el cierre sale por un lado, el otro escenario queda anulado.</div></div>`;
  }
  const r = rrOf(p), [rc, rt] = resTxt(r.out), [vc, vt] = verdict(p.ev);
  const same = S.D.patterns.filter(q => q.name === p.name && q !== p && q.out && (q.out.res === 'target' || q.out.res === 'stop'));
  const w = same.filter(q => q.out.res === 'target').length;
  return hd + `
    <div class="small" style="margin-top:3px">${p.desc} · ${p.dir > 0 ? 'sesgo alcista' : p.dir < 0 ? 'sesgo bajista' : 'neutral'} · completado el ${dstr(S.D.bars.t[p.i])}</div>
    <table class="lv"><tr><td>Entrada</td><td>${fx(r.entry)}</td></tr><tr><td style="color:var(--emerald)">Objetivo</td><td>${fx(r.target)} (${pc((r.target / r.entry - 1) * 100 * p.dir)})</td></tr>
    <tr><td style="color:var(--emerald)">T1 (50 %)</td><td>${fx(r.t1)} (${pc((r.t1 / r.entry - 1) * 100 * p.dir)})</td></tr>
    <tr><td style="color:var(--ember)">Stop${r.tact ? ' táctico' : ' estructural'}</td><td>${fx(r.stop)} (${pc((r.stop / r.entry - 1) * 100 * p.dir)})</td></tr><tr><td>Recompensa / riesgo</td><td>${r.rr != null ? r.rr.toFixed(2) : '—'}</td></tr></table>
    <div class="small">${p.note}</div>${p.conf && p.conf.length ? `<div class="small" style="margin-top:4px"><b>También saltan en esas sesiones</b> (mismo sentido, ±3): ${p.conf.join(' · ')}. Suelen medir casi lo mismo: no son confirmaciones independientes.</div>` : ''}${obsTxt(p.rr.obs)}${r.rr != null && r.rr < 1 ? '<div class="small" style="color:var(--ember)">R:R menor que 1: con la medida clásica el riesgo es mayor que la recompensa teórica.</div>' : ''}
    <div class="verdict ${rc === 't' ? 'g' : rc === 's' ? 'r' : 'n'}" style="margin-top:8px"><b>Qué pasó aquí:</b> ${rt}</div>
    ${same.length ? `<div class="small">En este valor, ${same.length === 1 ? 'otra señal cerrada' : 'otras ' + same.length + ' señales cerradas'} de «${p.label}»: ${w} ${w === 1 ? 'llegó' : 'llegaron'} al objetivo y ${same.length - w} al stop.</div>` : ''}
    <div class="verdict ${vc}">${vt}</div>${evLines(p.ev)}${evHq(p)}</div>`;
}
function radar() {
  const rows = S.idx.symbols.filter(x => (x.active || []).length).map(x => {
    const a = x.active.filter(q => S.f[q.fam] && (!S.f.dir || q.dir === S.f.dir || q.st === 'forming') && (q.q == null || q.q >= S.f.q));
    return {x, a, fig: a.filter(q => q.fam === 'figuras').length};
  }).filter(r => r.a.length).sort((u, v) => v.fig - u.fig || v.a.length - u.a.length);
  if (!rows.length) return '<div class="empty">Ningún valor con patrones activos y los filtros actuales.</div>';
  return `<div class="small" style="margin-bottom:8px">Valores con patrones completados en las últimas sesiones (según los filtros de familia y sentido). Clic para abrirlos con el patrón seleccionado.</div>` + rows.map(r => `<div class="pc" data-go="${r.x.sym}|${(r.a.find(q => q.fam === 'figuras') || r.a[0]).id}"><div class="pc-h"><span style="font-size:14px">${r.x.sym}</span><span class="tag">${fx(r.x.close)}</span><span class="tag">ATR ${r.x.atrp} %</span></div><div class="top">${r.a.map(q => `<span class="chip ${q.dir > 0 ? 'u' : q.dir < 0 ? 'd' : ''}">${q.st === 'forming' ? '◐' : q.dir > 0 ? '▲' : q.dir < 0 ? '▼' : '◆'} ${q.label}${q.q != null ? ' · Q' + q.q : ''}${q.rr ? ' · ' + q.rr.toFixed(1) : ''}</span>`).join('')}</div></div>`).join('');
}
function reading() {
  const D = S.D, sm = D.summary, c = sm.close, b = D.bars, n = D.n;
  const s50 = D.sma50[n - 1], s200 = D.sma200[n - 1];
  const trend = s50 == null ? '—' : (c > s50 && s50 > (s200 ?? 0)) ? 'alcista (precio sobre la media de 50 y esta sobre la de 200)' : c < s50 && s50 < (s200 ?? 1e9) ? 'bajista (precio bajo la media de 50 y esta bajo la de 200)' : 'mixta';
  const up = D.sr.filter(z => z.p > c).sort((a, b) => a.p - b.p)[0], dn = D.sr.filter(z => z.p < c).sort((a, b) => b.p - a.p)[0];
  const done = D.patterns.filter(p => p.out && (p.out.res === 'target' || p.out.res === 'stop')), won = done.filter(p => p.out.res === 'target').length;
  const byFam = {}; for (const p of done) { const k = p.fam; (byFam[k] = byFam[k] || [0, 0]); byFam[k][p.out.res === 'target' ? 0 : 1]++; }
  return `<h3>${S.sym} · lectura</h3><div class="kv"><span>Tendencia</span><span>${trend}</span><span>Cierre</span><span>${fx(c)}</span>
    <span>Media 50 / 200</span><span>${fx(s50)} / ${fx(s200)}</span><span>Distancia a la media 200</span><span>${sm.dist200 == null ? '—' : pc(sm.dist200)}</span>
    <span>Rango anual</span><span>${sm.pos52 == null ? '—' : (sm.pos52 * 100).toFixed(0) + ' % (0 = mínimo, 100 = máximo)'}</span><span>RSI(14) / RSI(2)</span><span>${sm.rsi14} / ${sm.rsi2}</span>
    <span>ATR (14)</span><span>${fx(sm.atr)} · ${sm.atrp} % del precio</span><span>Resistencia más cercana</span><span>${up ? fx(up.p) + ' (' + pc((up.p / c - 1) * 100) + ', ' + up.touches + ' toques)' : '—'}</span>
    <span>Soporte más cercano</span><span>${dn ? fx(dn.p) + ' (' + pc((dn.p / c - 1) * 100) + ', ' + dn.touches + ' toques)' : '—'}</span></div>
    <h3 style="margin-top:12px">Qué pasó con los patrones de este valor</h3>
    <div class="small">${done.length} patrones llegaron a su objetivo o a su stop en los últimos ${n} días: <b>${won}</b> al objetivo y <b>${done.length - won}</b> al stop (${done.length ? (won / done.length * 100).toFixed(0) : '—'} %). Con un R:R de 2 se necesita acertar más del 33 % para no perder, pero hay que descontar costes y el sesgo de elegir qué patrones mirar a posteriori.</div>
    <div class="kv" style="margin-top:6px">${Object.entries(byFam).map(([k, v]) => `<span>${FAMS[k] || k}</span><span>${v[0]} objetivo · ${v[1]} stop</span>`).join('')}</div>
    <div class="small" style="margin-top:10px">Cómo se calculan: entrada en el cierre de la barra que completa el patrón; objetivo por medida clásica del patrón (altura de la figura proyectada); stop estructural al otro lado de la figura o táctico a 1,5 ATR; el resultado se simula entrando en la apertura siguiente, el stop gana si se tocan ambos el mismo día y se cierra a los 40 días.</div>`;
}

/* ───────────────────────── selección y entrada ───────────────────────── */
function extents(p) {
  const xs = [p.i], ys = [];
  p.pts.forEach(q => { xs.push(q[0]); ys.push(q[1]); });
  p.lines.forEach(l => { xs.push(l.a[0], l.b[0]); ys.push(l.a[1], l.b[1]); });
  p.polys.forEach(pl => pl.pts.forEach(q => { xs.push(q[0]); ys.push(q[1]); }));
  p.zones.forEach(z => { xs.push(z.i0, z.i1); ys.push(z.lo, z.hi); });
  return {xs: xs.filter(x => x > p.i - 170), ys};
}
function select(p, center) {
  S.sel = p && p === S.sel && !center ? null : p;
  if (S.sel && center) {
    const L = layout(), e = extents(S.sel), iA = Math.min(...e.xs), iB = S.sel.i + 30;
    const w = L.x1 - L.x0;
    S.view.ppb = Math.max(2.2, Math.min(12, w / (iB - iA + 10)));
    S.view.start = iA - 5;
    if (S.view.start + w / S.view.ppb > S.D.n + 40) S.view.start = S.D.n + 40 - w / S.view.ppb;
    if (S.view.start < -12) S.view.start = -12;
  }
  draw(); renderPane();
  if (S.sel) { const pn = $('#pane'), el = pn.querySelector('.pc.sel'); if (el) pn.scrollTop = Math.max(0, el.offsetTop - pn.offsetTop - 6); }
}
function hitAt(x, y) { for (let k = S.hits.length - 1; k >= 0; k--) { const h = S.hits[k].rc; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return S.hits[k].p; } return null; }
function setupInput() {
  const st = $('#stage'); let drag = null, pinch = null, moved = 0;
  const pos = e => { const r = st.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  const clampView = () => { const L = layout(), vn = (L.x1 - L.x0) / S.view.ppb; S.view.start = Math.max(-12, Math.min(S.view.start, S.D.n - vn + 40)); };
  st.addEventListener('mousedown', e => { if (e.button) return; drag = {x: e.clientX, s: S.view.start}; moved = 0; st.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', e => { if (drag && moved < 4) { const p = hitAt(pos(e).x, pos(e).y); if (p) select(p, false); else if (S.sel) select(null); } drag = null; st.style.cursor = ''; });
  window.addEventListener('mousemove', e => {
    if (!S.D) return;
    if (drag) { moved += Math.abs(e.movementX) + Math.abs(e.movementY); S.view.start = drag.s - (e.clientX - drag.x) / S.view.ppb; clampView(); S.cross = null; draw(); return; }
    const r = st.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { if (S.cross) { S.cross = null; draw(); } return; }
    const q = pos(e), p = hitAt(q.x, q.y);
    st.style.cursor = p ? 'pointer' : 'crosshair';
    S.cross = q; if (p !== S.hover) S.hover = p; draw(); tip(q, p);
  });
  st.addEventListener('mouseleave', () => { S.cross = null; S.hover = null; $('#tip').style.display = 'none'; draw(); });
  st.addEventListener('wheel', e => { e.preventDefault(); const q = pos(e), i = iFromX(q.x), f = Math.exp(-e.deltaY * 0.0015); S.view.ppb = Math.max(1.6, Math.min(40, S.view.ppb * f)); S.view.start = i - (q.x - layout().x0) / S.view.ppb + 0.5; clampView(); draw(); }, {passive: false});
  st.addEventListener('touchstart', e => { if (e.touches.length === 1) { drag = {x: e.touches[0].clientX, s: S.view.start}; moved = 0; } else if (e.touches.length === 2) { drag = null; pinch = {d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), p: S.view.ppb}; } }, {passive: true});
  st.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length === 1 && drag) { moved += 1; S.view.start = drag.s - (e.touches[0].clientX - drag.x) / S.view.ppb; clampView(); draw(); } else if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); S.view.ppb = Math.max(1.6, Math.min(40, pinch.p * d / pinch.d)); clampView(); draw(); } }, {passive: false});
  st.addEventListener('touchend', e => { if (drag && moved < 4 && e.changedTouches.length) { const r = st.getBoundingClientRect(), t = e.changedTouches[0], p = hitAt(t.clientX - r.left, t.clientY - r.top); if (p) select(p, false); } drag = null; pinch = null; });
  window.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'Escape') select(null);
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.shiftKey && S.D) { const l = S.D.patterns.filter(vis).sort((a, b) => a.i - b.i); if (l.length) { const k = S.sel ? l.indexOf(S.sel) : -1; const nx = e.key === 'ArrowRight' ? l[Math.min(l.length - 1, k + 1)] : l[Math.max(0, (k < 0 ? l.length : k) - 1)]; select(nx, true); e.preventDefault(); } } const k = S.idx && S.idx.symbols; if (!k) return; const i = k.findIndex(s => s.sym === S.sym); if (e.key === 'ArrowRight' && e.shiftKey) loadSym(k[(i + 1) % k.length].sym); if (e.key === 'ArrowLeft' && e.shiftKey) loadSym(k[(i - 1 + k.length) % k.length].sym); });
}
function tip(q, p) {
  const el = $('#tip'), b = S.D.bars, i = Math.round(iFromX(q.x));
  if (i < 0 || i >= S.D.n) { el.style.display = 'none'; return; }
  let h = `<b>${dstr(b.t[i])}</b><br>A ${fx(b.o[i])} · M ${fx(b.h[i])}<br>m ${fx(b.l[i])} · C ${fx(b.c[i])} (${pc((b.c[i] / (b.c[i - 1] || b.o[i]) - 1) * 100)})`;
  if (p) { const r = rrOf(p); h += `<br><span style="color:${col(p.dir)}"><b>${p.label}</b></span>${p.q != null ? ' · Q ' + p.q : ''} · R:R ${r.rr != null ? r.rr.toFixed(1) : '—'}<br>${status(p)[1]}<br><i>clic para ver el detalle</i>`; }
  el.innerHTML = h; el.style.display = 'block';
  const w = el.offsetWidth; el.style.left = Math.min(q.x + 16, S.W - w - 8) + 'px'; el.style.top = Math.max(q.y - 70, 6) + 'px';
}
$('#legend').innerHTML = '<span style="color:var(--emerald)"><s></s>alcista</span><span style="color:var(--ember)"><s></s>bajista</span><span style="color:var(--amber)"><s></s>neutral</span><span style="color:var(--sapphire)"><s></s>media 50</span><span style="color:var(--violet)"><s></s>media 200</span><span style="color:var(--cyan)"><u style="background:var(--cyan)"></u>soporte</span><span style="color:var(--violet)"><u style="background:var(--violet)"></u>resistencia</span><span><u style="background:var(--emerald)"></u>recompensa</span><span><u style="background:var(--ember)"></u>riesgo</span><span>Q = calidad de la figura (0–100) · ◐ figura en formación</span><span>arrastra · rueda: zoom · clic en una etiqueta · ◀ ▶ recorre los patrones · Mayús+◀▶ cambia de valor</span>';
$('#png').onclick = () => { const a = document.createElement('a'); a.download = S.sym + '-patrones.png'; a.href = cv.toDataURL('image/png'); a.click(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { draw(); renderPane(); });
new MutationObserver(() => { draw(); renderPane(); }).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
init();
</script>
